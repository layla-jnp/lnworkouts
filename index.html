<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layla's Fitness Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            color: #ff6b6b;
        }
        
        .section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #4ecdc4;
        }
        
        .section h2 {
            color: #4ecdc4;
            margin-bottom: 15px;
            font-size: 1.8em;
        }
        
        .warmup-button {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }
        
        .warmup-button:hover {
            background-color: #ff5252;
        }
        
        .progress-container {
            margin-bottom: 20px;
        }
        
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background-color: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #4ecdc4;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #ff6b6b);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .week {
            margin-bottom: 30px;
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
        }
        
        .week h3 {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .workout-slot {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #2a2a2a;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        
        .workout-slot:hover {
            background-color: #3a3a3a;
        }
        
        .workout-slot.completed {
            background-color: #1e4d47;
        }
        
        .workout-slot input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #4ecdc4;
        }
        
        .workout-link {
            color: #4ecdc4;
            text-decoration: none;
            flex: 1;
            font-weight: 500;
        }
        
        .workout-link:hover {
            text-decoration: underline;
            color: #ff6b6b;
        }
        
        .duration {
            color: #999;
            font-size: 0.9em;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Iron Series Fitness Dashboard</h1>
        
        <div class="section">
            <h2>🔥 Warmups</h2>
            <p>Get warmed up before each workout with Caroline's dynamic warmup playlist.</p>
            <a href="https://www.youtube.com/playlist?list=PLhu1QCKrfgPUczcbyXa35oUo2CdaHqgZ6" class="warmup-button" target="_blank">View Warmup Playlist</a>
        </div>
        
        <div class="section">
            <h2>📊 Progress Tracker</h2>
            <div class="progress-container">
                <div class="progress-stats">
                    <span>Total Workouts: <span id="completed">0</span> / 36</span>
                    <span>Completion Rate: <span id="percentage">0</span>%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>📅 12-Week Iron Series Program</h2>
            <p style="margin-bottom: 20px; color: #999;">3 workouts per week • Complete all 36 videos over 12 weeks</p>
            <div id="programContainer"></div>
        </div>
    </div>
    
    <script>
        // Video data with individual video IDs
        const videos = [
            { id: "SCxNnWW2zB8", title: "Leg Workout", duration: "41:48" },
            { id: "tczVC2rRO7U", title: "Upper Body Strength", duration: "47:14" },
            { id: "l7C2F3h_RQQ", title: "Full Body Conditioning", duration: "44:28" },
            { id: "6lZjcPW5GyI", title: "Glutes and Legs", duration: "43:18" },
            { id: "Jz1h0bj73V0", title: "Upper Body Hypertrophy", duration: "48:36" },
            { id: "J9m3YqQJMNA", title: "Cardio and Core", duration: "42:04" },
            { id: "BwJLnwTzxW4", title: "Leg Strength", duration: "41:34" },
            { id: "Fn3YCWl0oZ8", title: "Push and Shoulders", duration: "46:52" },
            { id: "3JlWLGV5Rqg", title: "Full Body Power", duration: "43:10" },
            { id: "tOU0iqWbVBA", title: "Glutes Focus", duration: "39:46" },
            { id: "6eYbNL1tNHI", title: "Back and Biceps", duration: "45:28" },
            { id: "qh5PdGEJqgE", title: "Lower Body Burn", duration: "40:52" },
            { id: "3tJvfEgHR_c", title: "Upper Body Endurance", duration: "47:08" },
            { id: "pqIlSDFuFQA", title: "Core and Stability", duration: "41:20" },
            { id: "cAa1cLlQPZA", title: "Total Body Strength", duration: "49:12" },
            { id: "K5S4Lfi0b5s", title: "Legs and Glutes", duration: "42:36" },
            { id: "6zFqTr6OBWQ", title: "Chest and Triceps", duration: "45:44" },
            { id: "AClNqh3x7bU", title: "Lower Body Power", duration: "41:08" },
            { id: "N0ksUPHuQnY", title: "Full Body Conditioning", duration: "44:16" },
            { id: "7T6BdlB-v-M", title: "Upper Body Volume", duration: "48:20" },
            { id: "Ii5c6J9KDBA", title: "Leg and Core Circuit", duration: "40:44" },
            { id: "BqGVME5fSEk", title: "Back and Shoulders", duration: "46:32" },
            { id: "PFYGUZxEAGo", title: "Total Body Metabolic", duration: "43:28" },
            { id: "c0cCPqZjnxY", title: "Glute Strength", duration: "41:56" },
            { id: "8BYqv0RLVIE", title: "Push Day", duration: "47:40" },
            { id: "Hm_QC5pXFMs", title: "Lower Body Endurance", duration: "42:12" },
            { id: "5Wd2CxVEaAM", title: "Full Body Hypertrophy", duration: "49:08" },
            { id: "AqJaW-2g5Ks", title: "Legs and Cardio", duration: "41:20" },
            { id: "OLdXlqzX-nw", title: "Upper Body Focus", duration: "46:48" },
            { id: "e6qxZvVnZRw", title: "Arms, Abs and Core Workout", duration: "40:32" }
        ];
        
        // Create program structure
        function generateProgram() {
            const container = document.getElementById('programContainer');
            let videoIndex = 0;
            
            for (let week = 1; week <= 12; week++) {
                const weekDiv = document.createElement('div');
                weekDiv.className = 'week';
                weekDiv.innerHTML = `<h3>Week ${week}</h3>`;
                
                for (let day = 1; day <= 3; day++) {
                    // For weeks 11-12, cycle back to videos 1-6
                    let currentVideoIndex;
                    if (week <= 10) {
                        currentVideoIndex = videoIndex;
                        videoIndex++;
                    } else {
                        currentVideoIndex = ((week - 11) * 3 + day - 1) % 6;
                    }
                    
                    const video = videos[currentVideoIndex];
                    const slotId = `workout-${week}-${day}`;
                    
                    const slotDiv = document.createElement('div');
                    slotDiv.className = 'workout-slot';
                    slotDiv.id = slotId;
                    slotDiv.innerHTML = `
                        <input type="checkbox" class="workout-checkbox" data-slot="${slotId}">
                        <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="workout-link">
                            Video ${currentVideoIndex + 1}: ${video.title}
                        </a>
                        <span class="duration">${video.duration}</span>
                    `;
                    
                    weekDiv.appendChild(slotDiv);
                }
                
                container.appendChild(weekDiv);
            }
            
            // Attach event listeners
            attachCheckboxListeners();
            loadProgress();
        }
        
        function attachCheckboxListeners() {
            const checkboxes = document.querySelectorAll('.workout-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', updateProgress);
            });
        }
        
        function updateProgress() {
            const checkboxes = document.querySelectorAll('.workout-checkbox');
            const completed = Array.from(checkboxes).filter(cb => cb.checked).length;
            const total = checkboxes.length;
            const percentage = Math.round((completed / total) * 100);
            
            // Update UI
            document.getElementById('completed').textContent = completed;
            document.getElementById('percentage').textContent = percentage;
            document.getElementById('progressFill').style.width = percentage + '%';
            
            // Update slot styling
            checkboxes.forEach(cb => {
                const slotId = cb.dataset.slot;
                const slot = document.getElementById(slotId);
                if (cb.checked) {
                    slot.classList.add('completed');
                } else {
                    slot.classList.remove('completed');
                }
            });
            
            // Save to localStorage
            saveProgress();
        }
        
        function saveProgress() {
            const checkboxes = document.querySelectorAll('.workout-checkbox');
            const progress = {};
            checkboxes.forEach(cb => {
                progress[cb.dataset.slot] = cb.checked;
            });
            localStorage.setItem('ironSeriesProgress', JSON.stringify(progress));
        }
        
        function loadProgress() {
            const saved = localStorage.getItem('ironSeriesProgress');
            if (saved) {
                const progress = JSON.parse(saved);
                Object.keys(progress).forEach(slotId => {
                    const checkbox = document.querySelector(`input[data-slot="${slotId}"]`);
                    if (checkbox) {
                        checkbox.checked = progress[slotId];
                    }
                });
            }
            updateProgress();
        }
        
        // Initialize
        generateProgram();
    </script>
</body>
</html>
