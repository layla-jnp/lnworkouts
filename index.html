<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON Series - 12 Week Fitness Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #ff6b6b;
            padding-bottom: 15px;
        }

        header h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        header p {
            color: #4ecdc4;
            font-size: 1.1em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .progress-section {
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #4ecdc4;
        }

        .progress-section h2 {
            color: #4ecdc4;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .progress-bar-container {
            background-color: #1a1a1a;
            border-radius: 10px;
            height: 30px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .progress-text {
            color: #b0b0b0;
            font-size: 0.95em;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .week-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #ff6b6b;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .week-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.2);
        }

        .week-card h3 {
            color: #ff6b6b;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .workout-item {
            background-color: #1a1a1a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .workout-item input[type="checkbox"] {
            margin-top: 4px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #4ecdc4;
        }

        .workout-item.completed {
            background-color: rgba(78, 205, 196, 0.1);
        }

        .workout-item.completed label {
            text-decoration: line-through;
            color: #888;
        }

        .workout-item label {
            flex: 1;
            cursor: pointer;
            font-size: 0.95em;
        }

        .workout-item a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .workout-item a:hover {
            color: #ff6b6b;
            text-decoration: underline;
        }

        .reset-button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-top: 20px;
        }

        .reset-button:hover {
            background-color: #ff5252;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #444;
            color: #888;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .week-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>💪 IRON Series</h1>
        <p>12-Week Fitness Dashboard</p>
    </header>

    <div class="container">
        <div class="progress-section">
            <h2>Overall Progress</h2>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="completedCount">0</span> / <span id="totalCount">0</span> workouts completed
            </div>
        </div>

        <div class="week-grid" id="weekGrid"></div>

        <button class="reset-button" onclick="resetProgress()">Reset All Progress</button>
    </div>

    <footer>
        <p>Workouts from Caroline Girvan's IRON Series | Track your progress and stay consistent 🎯</p>
    </footer>

    <script>
        // Video data: 30 videos from IRON Series
        const videos = [
            { id: 'SCxNnWW2zB8', title: 'Leg Workout' },
            { id: 'tczVC2rRO7U', title: 'Back & Bicep Workout' },
            { id: '2Qd-LJNJYWA', title: 'Shoulder & Trap Workout' },
            { id: 'xVj2Q2_2EJY', title: 'Chest & Tricep Workout' },
            { id: 'U-OYrmX2-k0', title: 'Full Body Workout' },
            { id: 'UBlcDuodQXM', title: 'Leg Workout' },
            { id: '0i5RILMI1Mk', title: 'Back & Bicep Workout' },
            { id: 'CFF4vI0oGPg', title: 'Shoulder & Trap Workout' },
            { id: 'BAtaHTTyfPI', title: 'Chest & Tricep Workout' },
            { id: 'xPxCcwG56Po', title: 'Full Body Workout' },
            { id: 'g4_muCNsPdk', title: 'Leg Workout' },
            { id: 'Hww8Y6GxVbw', title: 'Back & Bicep Workout' },
            { id: 'ZQfJ36EXX2s', title: 'Shoulder & Trap Workout' },
            { id: 'KAEALlzcMcQ', title: 'Chest & Tricep Workout' },
            { id: 'xbtAVsMdVSY', title: 'Full Body Workout' },
            { id: 'knrmFCI4XiI', title: 'Leg Workout' },
            { id: '_UFvhXTN2-U', title: 'Back & Bicep Workout' },
            { id: 'EN-zuVg4mok', title: 'Shoulder & Trap Workout' },
            { id: 'SjSJU-LOLf8', title: 'Chest & Tricep Workout' },
            { id: 'B-XyUrXEaCw', title: 'Full Body Workout' },
            { id: 'ucTDJRJjFQ4', title: 'Leg Workout' },
            { id: 'dnHSrYHT0Zk', title: 'Back & Bicep Workout' },
            { id: 'K-tLY96Jq6o', title: 'Shoulder & Trap Workout' },
            { id: 'LubR2sFpT_E', title: 'Chest & Tricep Workout' },
            { id: 'ReE9zLhksbc', title: 'Full Body Workout' },
            { id: 'xefU5YoKMoI', title: 'Leg Workout' },
            { id: 'tfgeRvBRtME', title: 'Back & Bicep Workout' },
            { id: '9xA0yL0KXkU', title: 'Shoulder & Trap Workout' },
            { id: 'bOJpvux_klI', title: 'Chest & Tricep Workout' },
            { id: 'P4cMTLqtRII', title: 'Arms, Abs and Core Workout' }
        ];

        // Program structure: 12 weeks, 3 workouts per week
        const program = [
            { week: 1, workouts: [0, 1, 2] },
            { week: 2, workouts: [3, 4, 5] },
            { week: 3, workouts: [6, 7, 8] },
            { week: 4, workouts: [9, 10, 11] },
            { week: 5, workouts: [12, 13, 14] },
            { week: 6, workouts: [15, 16, 17] },
            { week: 7, workouts: [18, 19, 20] },
            { week: 8, workouts: [21, 22, 23] },
            { week: 9, workouts: [24, 25, 26] },
            { week: 10, workouts: [27, 28, 29] },
            { week: 11, workouts: [0, 1, 2] },
            { week: 12, workouts: [3, 4, 5] }
        ];

        // Initialize and render
        function initDashboard() {
            renderWeeks();
            updateProgress();
        }

        function renderWeeks() {
            const weekGrid = document.getElementById('weekGrid');
            weekGrid.innerHTML = '';

            program.forEach(weekData => {
                const weekCard = document.createElement('div');
                weekCard.className = 'week-card';
                weekCard.innerHTML = `<h3>Week ${weekData.week}</h3>`;

                weekData.workouts.forEach((videoIndex, dayIndex) => {
                    const video = videos[videoIndex];
                    const checkboxId = `video-${weekData.week}-${dayIndex}`;
                    const isCompleted = localStorage.getItem(checkboxId) === 'true';

                    const workoutItem = document.createElement('div');
                    workoutItem.className = `workout-item ${isCompleted ? 'completed' : ''}`;
                    workoutItem.innerHTML = `
                        <input type="checkbox" id="${checkboxId}" ${isCompleted ? 'checked' : ''} onchange="updateProgress()">
                        <label for="${checkboxId}">
                            <a href="https://youtu.be/${video.id}" target="_blank">${video.title}</a>
                        </label>
                    `;

                    // Save state to localStorage when checkbox changes
                    workoutItem.querySelector('input').addEventListener('change', (e) => {
                        localStorage.setItem(checkboxId, e.target.checked);
                        workoutItem.classList.toggle('completed', e.target.checked);
                        updateProgress();
                    });

                    weekCard.appendChild(workoutItem);
                });

                weekGrid.appendChild(weekCard);
            });
        }

        function updateProgress() {
            let completed = 0;
            const total = program.length * 3; // 12 weeks × 3 workouts per week

            program.forEach(weekData => {
                weekData.workouts.forEach((_, dayIndex) => {
                    const checkboxId = `video-${weekData.week}-${dayIndex}`;
                    if (localStorage.getItem(checkboxId) === 'true') {
                        completed++;
                    }
                });
            });

            const percentage = (completed / total) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressBar').textContent = Math.round(percentage) + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
                program.forEach(weekData => {
                    weekData.workouts.forEach((_, dayIndex) => {
                        const checkboxId = `video-${weekData.week}-${dayIndex}`;
                        localStorage.removeItem(checkboxId);
                    });
                });
                renderWeeks();
                updateProgress();
            }
        }

        // Initialize on page load
        initDashboard();
    </script>
</body>
</html>
