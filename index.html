<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #ff6b6b;
        }
        
        .section {
            background-color: #2a2a2a;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
        }
        
        .section h2 {
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .workout-item {
            background-color: #333;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: bold;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Fitness Dashboard</h1>
        
        <div class="section">
            <h2>Warmups</h2>
            <div class="workout-item">
                <span>Warmup Playlist</span>
                <a href="https://www.youtube.com/playlist?list=PLhu1QCKrfgPUczcbyXa35oUo2CdaHqgZ6" target="_blank">
                    Watch on YouTube →
                </a>
            </div>
        </div>
        
        <div class="section">
            <h2>Iron Series Workouts</h2>
            <div class="workout-item">
                <span>Iron Series Video</span>
                <a href="https://www.youtube.com/watch?v=HdCk-Ij3hXE" target="_blank">
                    Watch on YouTube →
                </a>
            </div>
        </div>
    </div>
</body>
</html>
